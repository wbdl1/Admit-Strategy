<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Admit Strategy Portal</title>
<style>
:root{
  --bg:#050816;--card:rgba(255,255,255,.085);--card2:rgba(255,255,255,.12);
  --text:#f7fbff;--muted:#aab7cf;--line:rgba(255,255,255,.14);
  --accent:#7c5cff;--accent2:#20e3b2;--warn:#fff4b8;--red:#ffd8d8;
  --success:#adfff0;--pending:#ffe9a8
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
html{scroll-behavior:smooth}
body{
  min-height:100vh;color:var(--text);
  background:
    radial-gradient(circle at 18% 8%,rgba(124,92,255,.38),transparent 28%),
    radial-gradient(circle at 82% 12%,rgba(32,227,178,.25),transparent 28%),
    #050816;
  padding:26px
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--success)}
.wrap{max-width:1160px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.brand{font-weight:950;font-size:1.28rem;letter-spacing:-.3px}
.pill{padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--line);color:#dce8ff}
.hero,.card,.error,.quick-nav,.save-status{
  border:1px solid var(--line);background:var(--card);backdrop-filter:blur(18px);
  border-radius:28px;box-shadow:0 24px 70px rgba(0,0,0,.28)
}
.hero{padding:30px;margin-bottom:16px}
.hero h1{font-size:clamp(2.35rem,5vw,4.4rem);line-height:1;letter-spacing:-2px;margin-bottom:12px}
.hero p{color:var(--muted);line-height:1.7;font-size:1.05rem}
.hero-line{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.plan-chip{display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;padding:8px 11px;border:1px solid rgba(32,227,178,.35);border-radius:999px;background:rgba(32,227,178,.1);color:var(--success);font-size:.78rem;font-weight:950;text-transform:uppercase;letter-spacing:.06em}
.quick-nav{display:flex;gap:8px;overflow-x:auto;padding:10px;margin:0 0 20px;position:sticky;top:8px;z-index:5}
.quick-nav a{flex:0 0 auto;text-decoration:none;color:#e9f4ff;font-weight:800;font-size:.86rem;padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.08)}
.quick-nav a:hover,.quick-nav a:focus-visible{background:rgba(32,227,178,.18);outline:none}
.save-status{display:none;padding:13px 16px;margin-bottom:16px;line-height:1.5}
.save-status.show{display:block}
.save-status.ok{border-color:rgba(32,227,178,.38);color:var(--success)}
.save-status.bad{border-color:rgba(255,160,160,.38);color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid.four{grid-template-columns:repeat(4,1fr)}
.card{padding:22px}
.card h2,.card h3{font-size:1.15rem;margin-bottom:10px}
.num{font-size:2.45rem;font-weight:950;letter-spacing:-1.5px;background:linear-gradient(90deg,#fff,#adfff0);-webkit-background-clip:text;color:transparent}
.bar{height:10px;background:rgba(255,255,255,.12);border-radius:999px;margin-top:12px;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.portal-section{margin-top:28px;scroll-margin-top:90px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:0 4px 12px}
.section-kicker{display:block;color:var(--success);font-size:.78rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
.section-head h2{font-size:clamp(1.45rem,2.5vw,2rem);letter-spacing:-.6px}
.section-head p{max-width:610px;color:var(--muted);line-height:1.55;text-align:right}
.wide{grid-column:1/-1}
.list{display:grid;gap:10px}
.item{padding:16px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid var(--line);line-height:1.5}
.item strong{display:inline-block;margin-bottom:4px}
.record-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.record-head strong{font-size:1.02rem;margin:0}
.record-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}
.record-edit{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.08);color:#fff;padding:6px 10px;font-size:.78rem;font-weight:850}
.record-edit:hover,.record-edit:focus-visible{border-color:var(--accent2);outline:none;background:rgba(32,227,178,.12)}
.details{display:grid;gap:8px}
.detail-row{display:grid;grid-template-columns:minmax(105px,135px) 1fr;gap:12px;align-items:start}
.detail-label{color:var(--success);font-size:.76rem;font-weight:850;letter-spacing:.02em;text-transform:uppercase}
.detail-value{color:#dce8ff;line-height:1.55;overflow-wrap:anywhere}
.muted{color:var(--muted);line-height:1.65}
.status,.date-chip,.score-chip{
  display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;
  background:rgba(32,227,178,.12);color:var(--success);font-size:.78rem;font-weight:850
}
.status.pending{background:rgba(255,212,108,.12);color:var(--pending)}
.status.problem{background:rgba(255,150,150,.12);color:var(--red)}
.date-chip{margin-top:5px;background:rgba(124,92,255,.18);color:#e3ddff}
.score-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.score-chip{background:rgba(255,255,255,.09);color:#dce8ff}
.empty{padding:18px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);line-height:1.6}
.error{padding:24px;line-height:1.7;color:var(--red)}
.error h1{font-size:1.4rem;margin-bottom:8px}
.error code{background:rgba(255,255,255,.11);padding:3px 6px;border-radius:7px;color:#fff}
.help{margin-top:14px;color:var(--warn)}
.meeting-help,.portal-note,.rubric,.info-box{
  margin-top:14px;padding:13px 14px;border:1px solid var(--line);
  background:rgba(255,255,255,.06);border-radius:16px;color:#dce8ff;line-height:1.55
}
.meeting-help{border-color:rgba(32,227,178,.22);background:rgba(32,227,178,.09);color:#dffff6}
.meeting-help a,.privacy-link{color:var(--success);font-weight:800}
.form-panel{margin-top:12px;border:1px solid var(--line);border-radius:16px;background:rgba(5,8,22,.38);overflow:hidden}
.form-panel summary{list-style:none;padding:13px 14px;font-weight:850;color:#dffff6;cursor:pointer}
.form-panel summary::-webkit-details-marker{display:none}
.form-panel summary:after{content:"+";float:right;color:var(--success);font-size:1.15rem}
.form-panel[open] summary:after{content:"–"}
.portal-form{display:grid;gap:11px;padding:0 14px 14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.portal-form label{display:grid;gap:6px;color:#dce8ff;font-size:.83rem;font-weight:800}
.portal-form input,.portal-form select,.portal-form textarea{
  width:100%;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.08);
  color:#fff;padding:11px 12px;outline:none
}
.portal-form input:focus,.portal-form select:focus,.portal-form textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(32,227,178,.12)}
.portal-form textarea{min-height:84px;resize:vertical}
.portal-form option{color:#111}
.portal-form .opt{display:flex;grid-template-columns:auto 1fr;gap:9px;align-items:flex-start;font-weight:650;line-height:1.5}.portal-form .opt input{width:auto;margin-top:3px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;
  padding:11px 15px;font-weight:900;text-decoration:none;background:linear-gradient(135deg,#fff,#dff7ff);color:#050816
}
.btn.secondary{background:rgba(255,255,255,.09);color:#fff;border:1px solid var(--line)}
.btn.ghost{background:transparent;color:#dce8ff;border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.form-actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.form-help{font-size:.78rem;color:var(--muted);line-height:1.5}
.planner-day{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.planner-day:first-child{border-top:0;padding-top:0}
.planner-date{font-weight:900;color:var(--success)}
.planner-blocks{display:grid;gap:9px}
.assessment-main{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.countdown{font-size:2rem;font-weight:950;color:var(--success);white-space:nowrap}
.prep-line{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.85rem;margin-top:10px}
.evidence-link{display:inline-flex;margin-top:3px;font-weight:850;overflow-wrap:anywhere}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:18px}
.demo-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.editing-note{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start}
.editing-note .status{margin-top:1px}
.edit-panel{display:none}
.editor-dialog{width:min(720px,calc(100% - 24px));max-height:88vh;margin:auto;border:1px solid var(--line);border-radius:24px;background:#0b1024;color:#fff;padding:0;box-shadow:0 30px 100px rgba(0,0,0,.7)}
.editor-dialog::backdrop{background:rgba(2,4,12,.78);backdrop-filter:blur(5px)}
.editor-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px 18px;background:#0b1024;border-bottom:1px solid var(--line)}
.editor-head h2{font-size:1.2rem}.editor-close{border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;width:36px;height:36px;font-size:1.25rem}
.editor-body{overflow:auto}.editor-body .portal-form{padding:18px}
.leitner-wrap{overflow-x:auto;padding-bottom:8px}
.leitner-board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:10px;min-width:1080px}
.leitner-box{min-height:260px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.045);padding:11px;transition:.18s ease}
.leitner-box.drag-over{border-color:var(--accent2);background:rgba(32,227,178,.12);transform:translateY(-2px)}
.leitner-title{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:10px}.leitner-title strong{font-size:.92rem}.leitner-title span{color:var(--muted);font-size:.72rem;text-align:right}
.review-card{border:1px solid var(--line);border-radius:14px;background:rgba(124,92,255,.13);padding:11px;margin-top:8px;cursor:grab}.review-card:active{cursor:grabbing}.review-card[aria-grabbed='true']{opacity:.55}
.review-card strong{display:block;overflow-wrap:anywhere}.review-meta{color:var(--muted);font-size:.76rem;line-height:1.45;margin-top:4px}.move-row{display:flex;gap:6px;margin-top:9px}.move-row button{flex:1;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.08);color:#fff;padding:6px;font-weight:850}
.review-card .detail-row{grid-template-columns:1fr;gap:2px}.review-card .detail-value{font-size:.82rem}
.calendar-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.calendar-source{border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(255,255,255,.055)}
.privacy-callout{border-color:rgba(32,227,178,.3);background:rgba(32,227,178,.08)}
.today-shell{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.45fr);gap:14px}.today-list{display:grid;gap:9px;margin-top:14px}.today-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.055)}.today-number{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:rgba(124,92,255,.24);color:#fff;font-weight:950}.today-item strong{display:block}.today-time{font-weight:950;color:var(--success);white-space:nowrap}.today-total{font-size:2.6rem;font-weight:950;letter-spacing:-1.5px;color:var(--success)}
.setup-list{display:grid;gap:9px;margin-top:12px}.setup-step{display:flex;gap:9px;align-items:center;color:#dce8ff}.setup-dot{width:22px;height:22px;display:grid;place-items:center;border-radius:999px;background:rgba(255,255,255,.1);font-size:.72rem;font-weight:950}.setup-step.done .setup-dot{background:rgba(32,227,178,.18);color:var(--success)}
.class-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px}.class-tab{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.06);color:#dce8ff;padding:8px 12px;font-weight:850}.class-tab.active{border-color:var(--accent2);background:rgba(32,227,178,.14);color:var(--success)}
.class-grid,.material-grid,.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.class-card{border:1px solid var(--line);border-top:4px solid var(--class-color,var(--accent2));border-radius:16px;padding:15px;background:rgba(255,255,255,.055)}.class-card h3{margin-bottom:4px}.intervals{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.intervals span{padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted);font-size:.73rem;font-weight:800}.course-card{border:1px solid var(--line);border-radius:16px;padding:16px;background:rgba(255,255,255,.05)}.course-card strong{display:block;margin-bottom:6px}.course-card span{color:var(--muted);line-height:1.5;font-size:.9rem}
.detected{margin:10px 0;padding:12px;border-radius:14px;border:1px solid rgba(255,212,108,.34);background:rgba(255,212,108,.08);color:#fff5c9}.detected strong{color:var(--pending)}
.locked-note{margin-top:10px;padding:12px;border-radius:14px;background:rgba(124,92,255,.1);border:1px solid rgba(124,92,255,.25);color:#ded8ff;line-height:1.5}
.footer{margin-top:28px;text-align:center;color:var(--muted);font-size:.9rem}
.hidden-frame{display:none}
@media(max-width:950px){.grid.four{grid-template-columns:repeat(2,1fr)}}
@media(max-width:850px){
  body{padding:18px}
  .grid,.grid.four,.columns,.today-shell,.class-grid,.material-grid,.course-grid{grid-template-columns:1fr}
  .top,.section-head,.settings-row{align-items:flex-start;flex-direction:column}
  .section-head p{text-align:left}
  .wide{grid-column:auto}
  .quick-nav{top:4px}
}
@media(max-width:620px){
  body{padding:12px}
  .hero,.card,.error,.quick-nav,.save-status{border-radius:22px}
  .hero{padding:23px}
  .card{padding:18px}
  .detail-row,.form-grid,.planner-day{grid-template-columns:1fr;gap:5px}
  .record-head,.assessment-main{flex-direction:column}.record-actions{justify-content:flex-start}
  .form-actions .btn{width:100%}
  .countdown{font-size:1.55rem}
  .quick-nav{margin-left:-4px;margin-right:-4px}
  .calendar-grid{grid-template-columns:1fr}.editor-dialog{max-height:94vh}
  .hero-line{flex-direction:column}.today-item{grid-template-columns:auto 1fr}.today-time{grid-column:2}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Admit Strategy Portal</div>
    <div class="pill" id="portalMode">Private student-and-parent workspace</div>
  </div>
  <div class="save-status" id="saveStatus" role="status" aria-live="polite"></div>
  <div id="app">
    <div class="hero">
      <h1>Loading portal...</h1>
      <p>Please wait while your student workspace loads.</p>
    </div>
  </div>
  <iframe class="hidden-frame" name="portalFrame" title="Portal update response"></iframe>
  <dialog class="editor-dialog" id="portalEditor" aria-labelledby="portalEditorTitle">
    <div class="editor-head"><h2 id="portalEditorTitle">Edit record</h2><button class="editor-close" type="button" data-close-editor aria-label="Close editor">×</button></div>
    <div class="editor-body" id="portalEditorBody"></div>
  </dialog>
  <div class="footer">Admit Strategy • Rayan (Ryan) Zayd Quereshi • <a class="privacy-link" href="privacy.html">Privacy</a></div>
</div>
<script>
const CONFIG = {
  googleScriptUrl: "https://script.google.com/macros/s/AKfycbxA7WKEAj1XGPCgwqTveIylnH_L4rEmMN7zYNTdTe8UwXWFTp3ZmjzydIlp5VFm_aT8sQ/exec",
  timeout: 45000
};

function demoDate(days){
  const date = new Date(qatarToday() + "T12:00:00");
  date.setDate(date.getDate() + Number(days || 0));
  return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2,"0") + "-" + String(date.getDate()).padStart(2,"0");
}

const DEMO_DATA = {

  },

    },

  ],

  sessionNotes: [
    {

  ],
  progressHistory: [],
  classes: [

function jsonp(url, callbackName, timeout){
  callbackName = callbackName || "callback";
  timeout = timeout || CONFIG.timeout;
  return new Promise(function(resolve,reject){
    const cb = "jsonp_" + Date.now() + "_" + Math.random().toString(16).slice(2);
    const script = document.createElement("script");
    const timer = setTimeout(function(){
      cleanup();
      reject(new Error("The portal server took too long to respond. Please refresh once."));
    }, timeout);
    function cleanup(){
      delete window[cb];
      if(script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timer);
    }
    window[cb] = function(data){ cleanup(); resolve(data); };
    script.onerror = function(){
      cleanup();
      reject(new Error("The portal server could not be reached."));
    };
    script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + callbackName + "=" + cb;
    document.body.appendChild(script);
  });
}

function safe(value){
  return String(value === null || value === undefined ? "" : value).replace(/[&<>"']/g,function(character){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[character];
  });
}

function safeUrl(value){
  try{
    const url = new URL(String(value || ""));
    return url.protocol === "https:" ? url.href : "";
  }catch(error){
    return "";
  }
}

function pct(value){
  const number = Number(value || 0);
  return Math.max(0,Math.min(100,number));
}

function qatarToday(){
  const parts = new Intl.DateTimeFormat("en-CA",{
    timeZone:"Asia/Qatar",year:"numeric",month:"2-digit",day:"2-digit"
  }).formatToParts(new Date());
  const values = {};
  parts.forEach(function(part){ values[part.type] = part.value; });
  return values.year + "-" + values.month + "-" + values.day;
}

function dayDifference(dateText){
  if(!dateText) return null;
  const start = new Date(qatarToday() + "T12:00:00");
  const end = new Date(String(dateText).slice(0,10) + "T12:00:00");
  if(isNaN(end.getTime())) return null;
  return Math.round((end.getTime() - start.getTime()) / 86400000);
}

function formatDate(dateText){
  if(!dateText) return "";
  const date = new Date(String(dateText).slice(0,10) + "T12:00:00");
  if(isNaN(date.getTime())) return String(dateText);
  return new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"short",year:"numeric"}).format(date);
}

function daysLabel(dateText){
  const days = dayDifference(dateText);
  if(days === null) return "";
  if(days === 0) return "Today";
  if(days === 1) return "Tomorrow";
  if(days > 1) return days + " days left";
  if(days === -1) return "1 day overdue";
  return Math.abs(days) + " days overdue";
}

function statusTone(status){
  const value = String(status || "").toLowerCase();
  if(value.indexOf("need") >= 0 || value.indexOf("overdue") >= 0 || value.indexOf("skip") >= 0) return "problem";
  if(value.indexOf("pending") >= 0 || value.indexOf("submit") >= 0 || value.indexOf("progress") >= 0 || value.indexOf("plan") >= 0) return "pending";
  return "";
}

function localTodayPlan(data){
  const today = qatarToday();
  const items = [];
  const classes = data.classes || [];
  function minutes(subject,fallback){
    const found = classes.find(function(item){ return String(item.name || "").toLowerCase() === String(subject || "").toLowerCase(); });
    return Number(found && found.defaultMinutes || fallback || 25);
  }
  (data.planner || []).forEach(function(item){
    if(item.date !== today || ["completed","skipped"].indexOf(String(item.status || "").toLowerCase()) >= 0) return;
    const start = String(item.startTime || "").split(":").map(Number);
    const end = String(item.endTime || "").split(":").map(Number);
    const duration = start.length === 2 && end.length === 2 ? (end[0] * 60 + end[1]) - (start[0] * 60 + start[1]) : 0;
    items.push({id:item.id,type:"Scheduled block",subject:item.subject || "Study",title:item.title,minutes:duration > 0 ? duration : minutes(item.subject,25),reason:item.startTime ? "Scheduled for " + item.startTime : "Scheduled today",priority:500});
  });
  (data.reviewCards || []).forEach(function(card){
    if(String(card.status || "").toLowerCase() === "mastered" || (card.nextReview && card.nextReview > today)) return;
    const byBox = {1:20,2:15,3:10,4:10};
    items.push({id:card.id,type:"Box review",subject:card.subject || "Review",title:card.term,minutes:Math.min(minutes(card.subject,25),byBox[Number(card.box)] || 10),reason:"Box " + Number(card.box || 1) + " review due",priority:380});
  });
  (data.assessments || []).forEach(function(item){
    const days = dayDifference(item.date);
    if(days === null || days < 0 || days > 21 || ["completed","cancelled"].indexOf(String(item.status || "").toLowerCase()) >= 0 || String(item.classificationStatus || "Confirmed").toLowerCase() === "needs confirmation") return;
    const remaining = Math.max(1,Number(item.prepTarget || 0) - Number(item.prepCompleted || 0));
    const difficulty = {Low:0,Medium:16,High:32}[item.difficulty] || 16;
    const importance = {Normal:0,High:18,Critical:36}[item.importance] || 0;
    items.push({id:item.id,type:"Assessment preparation",subject:item.subject || "Assessment",title:item.name,minutes:minutes(item.subject,25),reason:(days === 0 ? "Due today" : "Due in " + days + " day" + (days === 1 ? "" : "s")) + " · " + remaining + " prep action" + (remaining === 1 ? "" : "s") + " remaining",priority:250 + Math.max(0,126-days*9) + difficulty + importance});
  });
  items.sort(function(a,b){ return b.priority-a.priority; });
  const selected = items.slice(0,7).map(function(item){ const copy=Object.assign({},item);delete copy.priority;return copy; });
  return {date:today,totalMinutes:selected.reduce(function(sum,item){ return sum+Number(item.minutes||0); },0),items:selected,method:"Rule-based priority using deadlines, difficulty, importance, scheduled blocks, and review dates."};
}

function reviewBoard(items,classes){
  const allCards = items || [];
  const subjects = subjectNames({classes:classes || [],reviewCards:allCards});
  const selectedMatch = subjects.find(function(subject){ return subject.toLowerCase() === String(selectedReviewSubject || "").toLowerCase(); });
  selectedReviewSubject = selectedMatch || subjects[0] || "Unassigned";
  const cards = allCards.filter(function(card){ return String(card.subject || "Unassigned").toLowerCase() === selectedReviewSubject.toLowerCase(); });
  const selectedClass = (classes || []).find(function(item){ return String(item.name || "").toLowerCase() === selectedReviewSubject.toLowerCase(); });
  const intervals = selectedClass && selectedClass.intervals || {1:1,2:3,3:7,4:14};
  const tabs = subjects.length ? "<div class='class-tabs' aria-label='Choose a class Box system'>" + subjects.map(function(subject){
    const count = allCards.filter(function(card){ return String(card.subject || "Unassigned").toLowerCase() === subject.toLowerCase(); }).length;
    return "<button class='class-tab " + (subject === selectedReviewSubject ? "active" : "") + "' type='button' data-review-subject='" + safe(subject) + "'>" + safe(subject) + " · " + count + "</button>";
  }).join("") + "</div>" : "";

function derive(data){
  data.reviewCards = data.reviewCards || [];
  data.classes = data.classes || [];
  data.materials = data.materials || [];
  data.calendarSources = data.calendarSources || [];
  data.calendarEvents = data.calendarEvents || [];
  data.reviewQueue = (data.weakPoints || []).filter(function(item){
    const status = String(item.status || "").toLowerCase();
    return item.nextReview && ["mastered","resolved","closed"].indexOf(status) === -1;
  }).sort(function(a,b){ return String(a.nextReview).localeCompare(String(b.nextReview)); });
  data.assessments = data.assessments || [];
  data.nextAssessment = data.assessments.filter(function(item){
    const status = String(item.status || "").toLowerCase();
    const classification = String(item.classificationStatus || "Confirmed").toLowerCase();
    return item.date >= qatarToday() && ["completed","cancelled"].indexOf(status) === -1 && classification !== "needs confirmation" && classification !== "dismissed";
  }).sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); })[0] || null;
  data.progressHistory = (data.progressHistory && data.progressHistory.length ? data.progressHistory : data.sessionNotes || []).filter(function(item){
    const progress = item.progress || {};
    return progress.studySystem !== null && progress.studySystem !== undefined ||
      progress.consistency !== null && progress.consistency !== undefined ||
      progress.direction !== null && progress.direction !== undefined;
  });
  data.plan = data.plan || "Free";
  data.planStatus = data.planStatus || "Active";
  data.todayPlan = data.todayPlan && Array.isArray(data.todayPlan.items) ? data.todayPlan : localTodayPlan(data);
  return data;
}

    currentData.assessments.push({
      id:actionId(),name:values.name,subject:values.subject,date:values.date,type:values.type,status:"Upcoming",
      prepTarget:Number(values.prepTarget || 0),prepCompleted:0,confidence:values.confidence,notes:values.notes,
      time:values.time,topics:values.topics,difficulty:values.difficulty,importance:values.importance,
      sourceType:"Manual",classificationStatus:"Confirmed"
    });
  }
  if(operation === "updateassessment"){
    const assessment = currentData.assessments.find(function(entry){ return entry.id === values.recordId; });
    if(assessment){
      Object.assign(assessment,{name:values.name,subject:values.subject,date:values.date,type:values.type,
        prepTarget:Number(values.prepTarget || 0),prepCompleted:Number(values.prepCompleted || 0),
        confidence:values.confidence,status:values.status,notes:values.notes,time:values.time,topics:values.topics,
        difficulty:values.difficulty,importance:values.importance,classificationStatus:"Confirmed"});
    }
  }
  if(operation === "classifyassessment"){
    const assessment = currentData.assessments.find(function(entry){ return entry.id === values.recordId; });
    if(assessment){ assessment.classificationStatus = values.decision;assessment.status = values.decision === "Confirmed" ? "Upcoming" : "Cancelled"; }
  }
  if(operation === "addclass"){
    currentData.classes.push({id:actionId(),name:values.name,teacher:values.teacher,color:values.color,
      defaultMinutes:Number(values.defaultMinutes || 25),intervals:{1:Number(values.box1Days || 1),2:Number(values.box2Days || 3),3:Number(values.box3Days || 7),4:Number(values.box4Days || 14)},status:"Active"});
  }
  if(operation === "updateclass"){
    const item = currentData.classes.find(function(entry){ return entry.id === values.recordId; });
    if(item){
      const previousName = String(item.name || "");
      Object.assign(item,{name:values.name,teacher:values.teacher,color:values.color,defaultMinutes:Number(values.defaultMinutes || 25),intervals:{1:Number(values.box1Days || 1),2:Number(values.box2Days || 3),3:Number(values.box3Days || 7),4:Number(values.box4Days || 14)}});
      if(previousName && previousName.toLowerCase() !== String(values.name || "").toLowerCase()){
        [currentData.planner,currentData.assessments,currentData.reviewCards,currentData.materials].forEach(function(list){
          (list || []).forEach(function(record){ if(String(record.subject || "").toLowerCase() === previousName.toLowerCase()) record.subject = values.name; });
        });
        if(String(selectedReviewSubject || "").toLowerCase() === previousName.toLowerCase()) selectedReviewSubject = values.name;
      }
    }
  }
  if(operation === "addmaterial"){
    currentData.materials.push({id:actionId(),title:values.title,subject:values.subject,fileType:values.fileType,url:values.url,notes:values.notes,status:"Active"});
  }
  if(operation === "updatematerial"){
    const item = currentData.materials.find(function(entry){ return entry.id === values.recordId; });
    if(item) Object.assign(item,{title:values.title,subject:values.subject,fileType:values.fileType,url:values.url,notes:values.notes});
  }
  if(operation === "addreviewcard"){
    currentData.reviewCards.push({id:actionId(),subject:values.subject,unit:values.unit,term:values.term,
      prompt:values.prompt,answer:values.answer,box:1,nextReview:qatarToday(),status:"Active"});
  }
  if(operation === "updatereviewcard"){
    const card = currentData.reviewCards.find(function(entry){ return entry.id === values.recordId; });
    if(card) Object.assign(card,{subject:values.subject,unit:values.unit,term:values.term,prompt:values.prompt,answer:values.answer});
  }
  if(operation === "movereviewcard") moveDemoReviewCard(values.recordId,Number(values.box));
  if(operation === "linkcalendar"){
    currentData.calendarSources.push({id:actionId(),provider:"Calendar",calendarName:values.calendarName,
      category:values.category,status:"Connected",lastSyncStatus:"Sample connection only — no URL saved"});
  }
  if(operation === "synccalendar"){
    const source = currentData.calendarSources.find(function(entry){ return entry.id === values.recordId; });
    if(source) source.lastSyncStatus = "Sample refreshed locally";
  }
  if(operation === "disconnectcalendar"){
    const source = currentData.calendarSources.find(function(entry){ return entry.id === values.recordId; });
    if(source){ source.status = "Disconnected";source.lastSyncStatus = "Disconnected in sample"; }
  }
  if(operation === "setreminders") currentData.portalReminders = values.enabled === "true";
  currentData.todayPlan = localTodayPlan(currentData);
  render(derive(currentData),true);
  showStatus("Sample updated locally. No real student data was saved.",true);
}

function moveDemoReviewCard(recordId,box){
  const card = currentData.reviewCards.find(function(entry){ return entry.id === recordId; });
  if(!card) return;
  const classItem = (currentData.classes || []).find(function(item){ return String(item.name || "").toLowerCase() === String(card.subject || "").toLowerCase(); });
  const intervals = Object.assign({1:1,2:3,3:7,4:14,5:0},classItem && classItem.intervals || {});
  card.box = Math.max(1,Math.min(5,Number(box || 1)));
  card.status = card.box === 5 ? "Mastered" : "Active";
  if(card.box === 5) card.nextReview = "";
  else{
    const date = new Date();date.setUTCDate(date.getUTCDate() + intervals[card.box]);
    card.nextReview = date.toISOString().slice(0,10);
  }
}

function submitRealAction(form,values){
  submitRealValues(values,form.querySelector("button[type='submit']"));
}

function submitRealValues(values,button){
  if(pendingAction){
    showStatus("Wait for the current portal update to finish.",false);
    return;
  }
  const id = actionId();
  const postForm = document.createElement("form");
  postForm.method = "POST";
  postForm.action = CONFIG.googleScriptUrl;
  postForm.target = "portalFrame";
  postForm.style.display = "none";
  const payload = Object.assign({},values,{
    action:"portalupdate",actionId:id,token:getToken(),website:""
  });
  Object.keys(payload).forEach(function(key){
    const input = document.createElement("input");
    input.type = "hidden";input.name = key;input.value = payload[key];
    postForm.appendChild(input);
  });
  document.body.appendChild(postForm);
  if(button) button.disabled = true;
  showStatus("Saving securely to the portal...",true);
  const timer = setTimeout(async function(){
    if(!pendingAction || pendingAction.id !== id) return;
    pendingAction = null;
    if(postForm.parentNode) postForm.parentNode.removeChild(postForm);
    if(button) button.disabled = false;
    showStatus("The server is still syncing. Refreshing the portal before you resubmit anything.",false);
    await refreshPortal(false);
  },CONFIG.timeout);
  pendingAction = {id:id,timer:timer,form:postForm,button:button};
  postForm.submit();
}

document.addEventListener("submit",function(event){
  const form = event.target.closest("form[data-portal-form]");
  if(!form) return;
  event.preventDefault();
  const values = formValues(form);
  if(values.operation === "submittaskproof" && !String(values.proofNote || "").trim() && !String(values.proofUrl || "").trim()){
    showStatus("Add an evidence note or an https evidence link.",false);
    return;
  }
  if(values.operation === "reviewweakpoint" && values.status !== "Mastered" && !values.nextReview){
    showStatus("Choose the next review date, or mark the weak point Mastered.",false);
    return;
  }
  if((values.operation === "addevidence" || values.operation === "updateevidence") &&
      !String(values.evidence || "").trim() && !String(values.proofUrl || "").trim()){
    showStatus("Add proof details or an https evidence link.",false);
    return;
  }
  if((values.operation === "addmaterial" || values.operation === "updatematerial") && !/^https:\/\//i.test(String(values.url || ""))){
    showStatus("Study material links must begin with https://",false);
    return;
  }
  if(isDemo) applyDemoAction(values);
  else submitRealAction(form,values);
});

document.addEventListener("click",function(event){
  const subjectButton = event.target.closest("[data-review-subject]");
  if(subjectButton){
    selectedReviewSubject = subjectButton.getAttribute("data-review-subject") || "";
    render(currentData,isDemo);
    const section = document.getElementById("leitner");
    if(section) section.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  const editorButton = event.target.closest("[data-open-editor]");
  if(editorButton){
    const owner = editorButton.closest("article");
    const index = Number(editorButton.getAttribute("data-open-editor") || 0);
    const source = owner && owner.querySelectorAll(".edit-panel")[index];
    const form = source && source.querySelector("form");
    if(form){
      const dialog = document.getElementById("portalEditor");
      document.getElementById("portalEditorTitle").textContent = editorButton.getAttribute("data-editor-title") || "Edit record";
      const body = document.getElementById("portalEditorBody");
      body.innerHTML = "";body.appendChild(form.cloneNode(true));
      dialog.showModal();
    }
    return;
  }
  const moveButton = event.target.closest("[data-move-review]");
  if(moveButton){
    const card = moveButton.closest("[data-review-id]");
    if(card) submitReviewMove(card.getAttribute("data-review-id"),Number(moveButton.getAttribute("data-move-review")),moveButton);
    return;
  }
  const button = event.target.closest("[data-close-form]");
  if(!button) return;
  const panel = button.closest("details.form-panel");
  const form = button.closest("form");
  if(form) form.reset();
  setFormDateDefaults();
  if(panel) panel.open = false;
  const dialog = button.closest("dialog");
  if(dialog) dialog.close();
});

document.addEventListener("click",function(event){
  const close = event.target.closest("[data-close-editor]");
  if(close) document.getElementById("portalEditor").close();
});

function submitReviewMove(recordId,box,button){
  const values = {operation:"movereviewcard",recordId:recordId,box:String(box)};
  if(isDemo) applyDemoAction(values);
  else submitRealValues(values,button);
}

document.getElementById("app").addEventListener("dragstart",function(event){
  const card = event.target.closest("[data-review-id]");
  if(!card) return;
  card.setAttribute("aria-grabbed","true");
  event.dataTransfer.effectAllowed = "move";
  event.dataTransfer.setData("text/plain",card.getAttribute("data-review-id"));
});
document.getElementById("app").addEventListener("dragend",function(event){
  const card = event.target.closest("[data-review-id]");
  if(card) card.setAttribute("aria-grabbed","false");
  document.querySelectorAll(".leitner-box.drag-over").forEach(function(box){ box.classList.remove("drag-over"); });
});
document.getElementById("app").addEventListener("dragover",function(event){
  const box = event.target.closest("[data-review-box]");
  if(!box) return;
  event.preventDefault();event.dataTransfer.dropEffect = "move";box.classList.add("drag-over");
});
document.getElementById("app").addEventListener("dragleave",function(event){
  const box = event.target.closest("[data-review-box]");
  if(box && !box.contains(event.relatedTarget)) box.classList.remove("drag-over");
});
document.getElementById("app").addEventListener("drop",function(event){
  const box = event.target.closest("[data-review-box]");
  if(!box) return;
  event.preventDefault();box.classList.remove("drag-over");
  const recordId = event.dataTransfer.getData("text/plain");
  if(recordId) submitReviewMove(recordId,Number(box.getAttribute("data-review-box")),null);
});

window.addEventListener("message",async function(event){
  const data = event.data || {};
  const responseFrame = document.querySelector("iframe[name='portalFrame']");
  if(!responseFrame || event.source !== responseFrame.contentWindow) return;
  if(data.source !== "admit-strategy-portal") return;
  if(!pendingAction || data.actionId !== pendingAction.id) return;
  clearTimeout(pendingAction.timer);
  if(pendingAction.form.parentNode) pendingAction.form.parentNode.removeChild(pendingAction.form);
  if(pendingAction.button) pendingAction.button.disabled = false;
  pendingAction = null;
  if(!data.ok){
    showStatus(data.error || "The portal update could not be saved.",false);
    return;
  }
  const editor = document.getElementById("portalEditor");
  if(editor.open) editor.close();
  showStatus(data.message || "Portal updated.",true);
  await refreshPortal(false);
});

async function refreshPortal(showLoading){
  if(showLoading){
    document.getElementById("app").innerHTML = "<div class='hero'><h1>Refreshing portal...</h1><p>Please wait.</p></div>";
  }
  try{
    const data = await jsonp(CONFIG.googleScriptUrl + "?action=portal&token=" + encodeURIComponent(getToken()));
    if(!data.ok){
      renderError("Could not load this portal.",safe(data.error || "Portal unavailable."),safe(data.help || "Use the full private portal link."));
      return false;
    }
    render(data,false);
    return true;
  }catch(error){
    renderError("Could not load portal.",safe(error.message));
    return false;
  }
}

async function load(){
  const params = new URLSearchParams(location.search);
  isDemo = params.get("demo") === "1";
  if(isDemo){
    document.getElementById("portalMode").textContent = "Sample portal — fictional interactive data";
    const demo = JSON.parse(JSON.stringify(DEMO_DATA));
    render(derive(demo),true);
    return;
  }
  if(!isConnected()){
    renderError("Portal backend is not connected.","The Google Apps Script web app URL is missing.","Contact Ryan instead of submitting anything again.");
    return;
  }
  if(!getToken()){
    renderError("Missing private portal token.","Open the full private link from your booking email.","The link should contain portal.html?token=...");
    return;
  }
  await refreshPortal(false);
}

load();
</script>
